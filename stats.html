<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Study Hub Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0f2460 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #00d9ff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #00ff88;
        }

        /* Stats Overview */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card.visitors {
            border-top: 3px solid #00d9ff;
        }

        .stat-card.pageviews {
            border-top: 3px solid #00ff88;
        }

        .stat-card.clicks {
            border-top: 3px solid #ff6b6b;
        }

        .stat-card.today {
            border-top: 3px solid #ffd93d;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-card.visitors .stat-value { color: #00d9ff; }
        .stat-card.pageviews .stat-value { color: #00ff88; }
        .stat-card.clicks .stat-value { color: #ff6b6b; }
        .stat-card.today .stat-value { color: #ffd93d; }

        .stat-label {
            color: #a0a0a0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Sections */
        .section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Click Stats Grid */
        .clicks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .subject-stats {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .subject-stats h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .subject-stats.chemistry h3 { color: #00d9ff; }
        .subject-stats.physics h3 { color: #ff6b6b; }
        .subject-stats.business h3 { color: #ffd93d; }

        .click-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .click-item:last-child {
            border-bottom: none;
        }

        .click-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #ccc;
            font-size: 0.9rem;
        }

        .click-count {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }

        /* Chart Container */
        .chart-container {
            height: 300px;
            position: relative;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 250px;
            padding: 1rem;
            gap: 0.5rem;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 60px;
        }

        .bar {
            width: 100%;
            background: linear-gradient(180deg, #00d9ff 0%, #0066ff 100%);
            border-radius: 4px 4px 0 0;
            min-height: 5px;
            transition: all 0.5s ease;
            position: relative;
        }

        .bar:hover {
            filter: brightness(1.2);
        }

        .bar-label {
            font-size: 0.7rem;
            color: #888;
            margin-top: 0.5rem;
            text-align: center;
        }

        .bar-value {
            font-size: 0.75rem;
            color: #00d9ff;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #888;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error */
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            color: #ff6b6b;
        }

        /* Refresh Button */
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .last-updated {
            color: #666;
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        /* Top Pages Table */
        .pages-table {
            width: 100%;
            border-collapse: collapse;
        }

        .pages-table th,
        .pages-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pages-table th {
            color: #888;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pages-table td {
            color: #ccc;
        }

        .pages-table .count {
            color: #00ff88;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.75rem;
            }
            
            .stats-overview {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stat-value {
                font-size: 2rem;
            }

            .clicks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Study Hub Analytics</h1>
            <p class="subtitle">Track visits and clicks on your study materials</p>
            <a href="index.html" class="back-link">← Back to Study Hub</a>
        </header>

        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading analytics data...</p>
            </div>
        </div>
    </div>

    <script>
        const API_TOKEN = '12tmoo7i14a021hqzvahxxjmuykbzyu5gx944eio9dfu6wgfjo';
        const API_BASE = 'https://dalil-bot.goatcounter.com/api/v0';

        // Button click tracking paths (now with 'click/' prefix)
        const clickPaths = {
            chemistry: [
                { path: 'click/chemistry-main-folder', label: 'Main Folder', icon: '📁' },
                { path: 'click/chemistry-powerpoints', label: 'PowerPoints', icon: '📊' },
                { path: 'click/chemistry-packs', label: 'Packs', icon: '📦' },
                { path: 'click/chemistry-ai-helper', label: 'AI Helper', icon: '🤖' }
            ],
            physics: [
                { path: 'click/physics-main-folder', label: 'Main Folder', icon: '📁' },
                { path: 'click/physics-powerpoints', label: 'PowerPoints', icon: '📊' },
                { path: 'click/physics-packs', label: 'Packs', icon: '📦' },
                { path: 'click/physics-ai-helper', label: 'AI Helper', icon: '🤖' }
            ],
            business: [
                { path: 'click/business-main-folder', label: 'Main Folder', icon: '📁' },
                { path: 'click/business-powerpoints', label: 'PowerPoints', icon: '📊' },
                { path: 'click/business-packs', label: 'Packs', icon: '📦' },
                { path: 'click/business-textbook', label: 'Textbook', icon: '📚' },
                { path: 'click/business-ai-helper', label: 'AI Helper', icon: '🤖' }
            ]
        };

        async function fetchStats() {
            try {
                const response = await fetch(`${API_BASE}/stats/total`, {
                    headers: {
                        'Authorization': `Bearer ${API_TOKEN}`
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch stats');
                return await response.json();
            } catch (error) {
                console.error('Error fetching total stats:', error);
                return null;
            }
        }

        async function fetchHits(period = 'week') {
            try {
                const response = await fetch(`${API_BASE}/stats/hits?period=${period}`, {
                    headers: {
                        'Authorization': `Bearer ${API_TOKEN}`
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch hits');
                return await response.json();
            } catch (error) {
                console.error('Error fetching hits:', error);
                return null;
            }
        }

        async function fetchPathStats(path) {
            try {
                const response = await fetch(`${API_BASE}/stats/hits?filter=${encodeURIComponent(path)}`, {
                    headers: {
                        'Authorization': `Bearer ${API_TOKEN}`
                    }
                });
                
                if (!response.ok) return 0;
                const data = await response.json();
                return data.total || 0;
            } catch (error) {
                return 0;
            }
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'k';
            }
            return num.toString();
        }

        async function loadAnalytics() {
            const content = document.getElementById('content');
            
            try {
                // Fetch main stats
                const [totalStats, hitsData] = await Promise.all([
                    fetchStats(),
                    fetchHits('week')
                ]);

                // Calculate totals
                let totalVisitors = 0;
                let totalPageviews = 0;
                let todayViews = 0;
                let dailyData = [];

                if (hitsData && hitsData.hits) {
                    hitsData.hits.forEach(hit => {
                        totalPageviews += hit.count || 0;
                        if (hit.stats) {
                            hit.stats.forEach(stat => {
                                dailyData.push({
                                    date: stat.day,
                                    count: stat.count
                                });
                            });
                        }
                    });
                }

                if (totalStats) {
                    totalVisitors = totalStats.total_unique || totalStats.total || 0;
                    totalPageviews = totalStats.total || totalPageviews;
                }

                // Get today's count
                const today = new Date().toISOString().split('T')[0];
                if (dailyData.length > 0) {
                    const todayData = dailyData.find(d => d.date === today);
                    todayViews = todayData ? todayData.count : 0;
                }

                // Build the dashboard HTML
                let html = `
                    <div class="stats-overview">
                        <div class="stat-card visitors">
                            <div class="stat-value">${formatNumber(totalVisitors)}</div>
                            <div class="stat-label">Unique Visitors</div>
                        </div>
                        <div class="stat-card pageviews">
                            <div class="stat-value">${formatNumber(totalPageviews)}</div>
                            <div class="stat-label">Total Page Views</div>
                        </div>
                        <div class="stat-card today">
                            <div class="stat-value">${formatNumber(todayViews)}</div>
                            <div class="stat-label">Views Today</div>
                        </div>
                        <div class="stat-card clicks">
                            <div class="stat-value" id="total-clicks">-</div>
                            <div class="stat-label">Total Clicks</div>
                        </div>
                    </div>

                    <div class="section">
                        <h2 class="section-title">📈 Views This Week</h2>
                        <div class="chart-container">
                            <div class="chart-bars" id="weekly-chart">
                                ${generateWeeklyChart(dailyData)}
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h2 class="section-title">🖱️ Button Clicks by Subject</h2>
                        <div class="clicks-grid">
                            <div class="subject-stats chemistry">
                                <h3>🧪 Chemistry</h3>
                                <div id="chemistry-clicks">
                                    <div class="loading"><div class="loading-spinner"></div></div>
                                </div>
                            </div>
                            <div class="subject-stats physics">
                                <h3>⚛️ Physics</h3>
                                <div id="physics-clicks">
                                    <div class="loading"><div class="loading-spinner"></div></div>
                                </div>
                            </div>
                            <div class="subject-stats business">
                                <h3>💼 Business</h3>
                                <div id="business-clicks">
                                    <div class="loading"><div class="loading-spinner"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="text-align: center; margin-top: 2rem;">
                        <button class="refresh-btn" onclick="location.reload()">
                            🔄 Refresh Data
                        </button>
                        <p class="last-updated">Last updated: ${new Date().toLocaleString()}</p>
                    </div>
                `;

                content.innerHTML = html;

                // Load click stats for each subject
                loadClickStats();

            } catch (error) {
                content.innerHTML = `
                    <div class="error">
                        <h3>⚠️ Could not load analytics</h3>
                        <p>${error.message}</p>
                        <button class="refresh-btn" onclick="location.reload()" style="margin-top: 1rem;">
                            🔄 Try Again
                        </button>
                    </div>
                `;
            }
        }

        function generateWeeklyChart(dailyData) {
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const today = new Date();
            let chartHtml = '';
            let maxCount = 1;

            // Get last 7 days
            const weekData = [];
            for (let i = 6; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const dayData = dailyData.find(d => d.date === dateStr);
                const count = dayData ? dayData.count : 0;
                weekData.push({
                    day: days[date.getDay()],
                    count: count,
                    isToday: i === 0
                });
                if (count > maxCount) maxCount = count;
            }

            weekData.forEach(data => {
                const height = Math.max((data.count / maxCount) * 200, 5);
                const barColor = data.isToday 
                    ? 'linear-gradient(180deg, #00ff88 0%, #00aa55 100%)'
                    : 'linear-gradient(180deg, #00d9ff 0%, #0066ff 100%)';
                
                chartHtml += `
                    <div class="bar-wrapper">
                        <div class="bar-value">${data.count}</div>
                        <div class="bar" style="height: ${height}px; background: ${barColor};"></div>
                        <div class="bar-label">${data.day}${data.isToday ? ' ★' : ''}</div>
                    </div>
                `;
            });

            return chartHtml;
        }

        async function loadClickStats() {
            let totalClicks = 0;

            for (const [subject, paths] of Object.entries(clickPaths)) {
                const container = document.getElementById(`${subject}-clicks`);
                let html = '';

                for (const item of paths) {
                    // For now, show placeholder - GoatCounter click tracking needs page loads to register
                    const count = 0; // Will populate as clicks happen
                    totalClicks += count;

                    html += `
                        <div class="click-item">
                            <span class="click-name">${item.icon} ${item.label}</span>
                            <span class="click-count">${count}</span>
                        </div>
                    `;
                }

                container.innerHTML = html;
            }

            // Update total clicks
            document.getElementById('total-clicks').textContent = formatNumber(totalClicks);
        }

        // Load analytics on page load
        loadAnalytics();
    </script>
</body>
</html>
